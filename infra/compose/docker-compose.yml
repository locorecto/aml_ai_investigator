services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATA_BASE_PATH: /data
      LOG_LEVEL: INFO
      ARTIFACTS_PATH: /artifacts
      CACHE_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 60
    volumes:
      - ../../data:/data:ro
      - ../../artifacts:/artifacts:rw
      - ${USERPROFILE}/.aml_ai_investigator.env:/root/.aml_ai_investigator.env:ro
    depends_on:
      - redis
  scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/scheduler/Dockerfile
    environment:
      DATA_BASE_PATH: /data
    volumes:
      - ../../data:/data:rw
  ui:
    build:
      context: ../..
      dockerfile: infra/docker/ui/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
